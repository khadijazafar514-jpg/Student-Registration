<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="index.html">Home</a>
    <h2>FILL THE REQUIRED FORM</h2>
    <form action="thanks.html" method="get"
    <label>Full name:</label>
    <input type="text" name="full name" placeholder=required>
    <br><br>
    <label>Registration no:</label>
    <input type="text" name="reg no" required>
    <br><br>
    <label>Email:</label>
    <input type="email" name="email" required>
    <br><br>
    <label>Phone</label>
    <input type="tel" name="tel"placeholder="03XXXXXXXXX">
    <label>Age</label>
    <input type="number" name="age" min="16" max="40">
    <br><br>
    <label>Date of Birth</label>
    <input type="date" name="date of birth">
    <br><br>
    <label>Gender</label>
    <input type="radio" name="gender" value="male">male
    <input type="radio" name="gender" value="female">female
    <br><br>
    <label>Interests</label>
    <input type="checkbox" name="interests" value="web">web
    <input type="checkbox" name="interests" value="Ai">Ai
    <input type="checkbox" name="interests" value="games">games
    <br><br>
    <label>Department:</label>
    <select name="department">
    <option value="Ai">Ai</option>
    <option value="Cs">Cs</option>
    <option value="SE">SE</option>
    <option value="EE">EE</option>
    </select>
    <br><br>
    <label>address</label>
    <textarea name="address" rows="4" cols="20"></textarea>


    <input type="submit" value="Register">
    <input type="reset" value="Clear">
    
    <br>
    </form>
</body>
</html>
